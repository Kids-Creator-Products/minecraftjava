name: Build and Deploy Minecraft Web Client

on:
  push:
    branches:
      - main  # Change to 'master' if your fork uses that branch name

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Install pnpm 📦
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Setup Node.js ⚙️
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies 🛠️
        run: pnpm install

      - name: Build project 🏗️
        run: pnpm run build
        env:
          # High memory limit to prevent build crashes
          NODE_OPTIONS: "--max_old_space_size=4096"

      - name: Deploy to GitHub Pages 🚀
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist # The folder produced by 'pnpm run build'
          branch: gh-pages # The branch the site will live on
